[project]
name = "agent2learn"
version = "0.1.0"
description = "A local, source-cited course vault for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

# PDF-to-Markdown is core, not an extra: the markdown twins are the substrate for
# navigation, citations, and the evidence scan. There is deliberately no `convert` extra.
#
# pdf-oxide is exact-pinned. Its output is part of the citation contract and it has
# changed extraction/Markdown artifact handling in a patch release (0.3.77). A converter
# bump requires a release that reruns the 262-PDF acceptance corpus, explains the output
# diff, regenerates the golden vault, and verifies bytes on all three operating systems.
dependencies = [
    "typer>=0.15,<1",
    "rich>=13,<15",
    "requests>=2.32,<3",
    "platformdirs>=4.2,<5",
    "keyring>=25,<27",
    "websocket-client>=1.8,<2",
    "pdf-oxide==0.3.77",
    "pytesseract>=0.3.13,<0.4",
    "pillow>=10,<13",
    "pypdfium2>=5.13,<6",
]

[project.optional-dependencies]
# Python 3.11-3.13 only in practice: markitdown -> magika -> onnxruntime publishes no
# cp314 wheels. The core package and the notebook extra are fully 3.14-capable, so this
# is a limitation of the extra, not of Agent2Learn. CI skips this extra on 3.14.
office = ["markitdown[pptx,docx,xlsx]>=0.1,<1"]
notebook = ["nbformat>=5.10,<6"]

[dependency-groups]
dev = [
    # >=9.0.3: 8.4.2 carries PYSEC-2026-1845, and a <9 cap would pin us below the fix.
    "pytest>=9.0.3,<10",
    "pytest-httpserver>=1.1,<2",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "cyclonedx-bom>=5,<8",
    "detect-secrets>=1.5,<2",
    # Runs the hooks in .pre-commit-config.yaml. Locked so the safety baseline is
    # reproducible: without it, `uv sync --frozen` removes an ad-hoc install and the
    # secret-scanning hooks silently become unrunnable.
    "pre-commit>=4,<5",
]

[project.scripts]
a2l = "agent2learn.cli:app"

[project.urls]
Repository = "https://github.com/ManagementMO/agent2learn"
Issues = "https://github.com/ManagementMO/agent2learn/issues"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
# Fixtures are data, not source. The notebook deliberately contains an undefined name so
# the converter has an error-output case to preserve; linting it is a category error.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.uv.build-backend]
data = { data = "skills" }
source-include = ["skills.sh.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Registered so the suite stays warning-free. The benchmark always checks correctness and scale;
# its wall-clock budget is only enforced when A2L_BENCHMARK_STRICT is set, because shared CI
# runners are too noisy for a timing assertion to mean anything.
markers = [
  "benchmark: measured performance budget, enforced only with A2L_BENCHMARK_STRICT",
]
