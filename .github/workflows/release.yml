# Tag-triggered release. It builds the artifacts exactly once and then promotes those same bytes,
# so what is verified, attested, and published is provably one build rather than three.
#
# Every action is pinned to a full commit SHA with the human-readable release in a comment. The
# four SHAs added for this workflow were resolved through the GitHub API on 2026-08-28 by reading
# the tag ref and, for the annotated tag on pypa/gh-action-pypi-publish, dereferencing it to its
# commit — not copied from documentation.
#
# Publishing uses PyPI Trusted Publishing. There is no API token anywhere in this file, and
# `id-token: write` is granted only to the two jobs that mint an OIDC token, never at top level.
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default. Individual jobs add only what they need.
permissions:
  contents: read

concurrency:
  # Never let two runs for the same tag publish concurrently.
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The upload authorization is a repository variable that this guard consumes exactly once.
    # Keeping the write permission on this job only prevents a later tag from reusing it.
    permissions:
      contents: read
      actions: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen --all-extras --dev

      # A tag that disagrees with the packaged version would publish something nobody reviewed
      # under a name people trust. Check it before anything is built.
      - name: The tag must match the declared version
        id: version
        run: |
          set -euo pipefail
          # tr -d '\r': a bash shell on a Windows runner would otherwise compare "0.1.0\r"
          # against "0.1.0" and refuse a correct tag.
          declared="$(uv run python -c 'import agent2learn; print(agent2learn.__version__)' | tr -d '\r')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match declared version $declared" >&2
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      # The published default must be the reviewed one. Enabling the mutating submission path is a
      # deliberate, separately authorised act, so a build that flips it cannot be released by
      # simply pushing a tag. The authorization is bound to this exact commit, so it cannot be
      # copied from a different build or reused for a later artifact.
      - name: Uploads must be disabled unless the release gate authorised them
        run: |
          set -euo pipefail
          enabled="$(uv run python -c 'from agent2learn import _release; print(_release.SUBMISSION_AVAILABLE)' | tr -d '\r')"
          if [ "$enabled" != "False" ]; then
            if [ "${A2L_SUBMISSION_RELEASE_SHA:-}" != "$GITHUB_SHA" ]; then
              echo "SUBMISSION_AVAILABLE is True but this commit has no supervised upload authorization" >&2
              exit 1
            fi
            # A retry must be re-authorised explicitly, even for the same tag.  If this DELETE
            # fails, fail closed rather than publishing a reusable authorization token.
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/variables/A2L_SUBMISSION_RELEASE_SHA"
            echo "::warning::publishing a build with SUBMISSION_AVAILABLE=True"
          fi
        env:
          A2L_SUBMISSION_RELEASE_SHA: ${{ vars.A2L_SUBMISSION_RELEASE_SHA }}
          GH_TOKEN: ${{ github.token }}

      - name: Full gate set
        run: |
          set -euo pipefail
          uv run ruff check .
          uv run ruff format --check src tests tools
          # Match mypy's grammar to the interpreter this job runs on, as ci.yml does. The lock
          # resolves numpy 2.5 for 3.12+, whose stubs use PEP 695 `type` statements that the
          # project's 3.11 default target cannot parse; the first tagged run failed on exactly that.
          uv run mypy --python-version 3.12 src tests tools
          uv run pip-audit --progress-spinner off
          uv run pytest -q
          uv run python tools/generate_fixtures.py --check
          uv run python tools/check_notices.py

      # Build once. Everything downstream consumes this artifact.
      - name: Build
        run: uv build

      - name: Metadata must render on PyPI
        run: uvx --from twine twine check --strict dist/*

      - name: Record the artifact hashes
        run: |
          set -euo pipefail
          uv run python - <<'PY' | tee dist/SHA256SUMS.txt
          import hashlib
          from pathlib import Path

          for path in sorted(Path("dist").iterdir()):
              if path.name == "SHA256SUMS.txt":
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"{digest}  {path.name}")
          PY

      - name: Generate an SBOM for the released dependency set
        run: |
          set -euo pipefail
          # Export the locked runtime graph, not this job's dev environment (which contains test
          # runners, linters, and release tooling that are never shipped to users).
          uv export --frozen --no-dev --format cyclonedx1.5 --output-file dist/sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error

  attest:
    name: attest provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz"

  installers:
    name: installer · ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Verify installers use the exact released artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("dist")
          lines = (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          expected = {
              name: digest
              for digest, name in (line.split("  ", 1) for line in lines if line.strip())
          }
          for path in root.iterdir():
              if path.name in {"SHA256SUMS.txt", "sbom.cdx.json"}:
                  continue
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if expected.get(path.name) != actual:
                  raise SystemExit(f"artifact hash mismatch: {path.name}")
          PY
          INDEX="$RUNNER_TEMP/a2l-release-candidate"
          mkdir -p "$INDEX/simple/agent2learn"
          cp dist/*.whl dist/*.tar.gz "$INDEX/"
          A2L_CANDIDATE_INDEX="$INDEX" python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["A2L_CANDIDATE_INDEX"])
          distributions = sorted(
              path for path in root.iterdir() if path.suffix == ".whl" or path.name.endswith(".tar.gz")
          )
          if not distributions:
              raise SystemExit("released artifact set contains no distribution")
          links = [
              f'<a href="../../{path.name}#sha256={hashlib.sha256(path.read_bytes()).hexdigest()}">'
              f"{path.name}</a>"
              for path in distributions
          ]
          (root / "simple" / "agent2learn" / "index.html").write_text(
              "\n".join(links) + "\n", encoding="utf-8", newline="\n"
          )
          PY
          # Make the exact, hash-bearing release artifact the first index for agent2learn. PyPI
          # remains the lower-priority source for the released package's dependencies.
          echo "UV_INDEX=$INDEX/simple" >> "$GITHUB_ENV"
          echo "UV_DEFAULT_INDEX=https://pypi.org/simple" >> "$GITHUB_ENV"
          echo "UV_INDEX_STRATEGY=first-index" >> "$GITHUB_ENV"
          echo "UV_FIND_LINKS=$INDEX" >> "$GITHUB_ENV"

      - name: Non-interactive installer smoke uses the tagged build
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          output="$(bash install.sh 2>&1 | tee /dev/stderr)"
          grep -Fq "run in a terminal: a2l init" <<< "$output"
          grep -Fq "verified: " <<< "$output"
          grep -Fq "${{ needs.build.outputs.version }}" <<< "$output"

      - name: Non-interactive Windows installer smoke uses the tagged build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = (& ./install.ps1 | Out-String)
          Write-Output $output
          if ($output -notmatch 'run in a terminal: a2l init') { throw "missing handoff" }
          if ($output -notmatch 'verified: ') { throw "missing verification" }
          if ($output -notmatch '${{ needs.build.outputs.version }}') { throw "wrong artifact version" }

  testpypi:
    name: publish to TestPyPI
    needs: [build, attest, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      # The SBOM and hash list are release evidence, not distribution files.
      - name: Keep only distributions
        run: rm -f dist/SHA256SUMS.txt dist/sbom.cdx.json

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  testpypi-smoke:
    name: install from TestPyPI · ${{ matrix.os }}
    needs: [build, testpypi]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Verify TestPyPI contains the exact released hashes
        env:
          A2L_RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          expected = {}
          for line in (Path("dist") / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              if line.strip():
                  digest, name = line.split("  ", 1)
                  expected[name] = digest
          if not expected:
              raise SystemExit("the release hash manifest is empty")
          for name, digest in expected.items():
              path = Path("dist") / name
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f"local artifact hash mismatch: {name}")

          version = os.environ["A2L_RELEASE_VERSION"]
          endpoint = f"https://test.pypi.org/pypi/agent2learn/{version}/json"
          request = urllib.request.Request(endpoint, headers={"Accept": "application/json"})
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          published = {
              item.get("filename"): (item.get("digests") or {}).get("sha256")
              for item in payload.get("urls", [])
              if isinstance(item, dict) and isinstance(item.get("filename"), str)
          }
          if set(published) != set(expected):
              raise SystemExit(
                  "TestPyPI distribution set differs from the release artifact set: "
                  f"expected {sorted(expected)}, found {sorted(published)}"
              )
          for name, digest in expected.items():
              if published.get(name) != digest:
                  raise SystemExit(f"artifact hash mismatch: {name}")
          print(f"TestPyPI hashes match {len(expected)} exact distributions")
          PY

      - name: Install the published candidate from TestPyPI
        run: |
          set -euo pipefail
          uv venv .release-venv
          uv pip install --python .release-venv \
            --index-url https://test.pypi.org/simple \
            --extra-index-url https://pypi.org/simple \
            --index-strategy first-index \
            "agent2learn==${{ needs.build.outputs.version }}"

      - name: Verify the TestPyPI installation
        run: |
          set -euo pipefail
          uv run --python .release-venv --no-project a2l --version

  github-release:
    name: attach GitHub release artifacts
    needs: [build, attest, installers, testpypi-smoke, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Attach the exact promoted distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
            --verify-tag --title "Agent2Learn ${{ needs.build.outputs.version }}" --generate-notes

  pypi:
    name: publish to PyPI
    needs: [build, attest, installers, testpypi, testpypi-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A protected environment is the final publication gate: the reviewer approving this
    # deployment authorizes the exact tested artifact set to become the PyPI release.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Confirm the promoted bytes still match the recorded hashes
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS.txt
          rm -f SHA256SUMS.txt sbom.cdx.json

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
