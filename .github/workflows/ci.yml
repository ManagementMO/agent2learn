# Three-OS CI. Windows is a first-class target from the first commit, not a later port.
#
# Every action is pinned to a full commit SHA with the human-readable release in a
# comment. A mutable tag is a supply-chain hole: the tag can be repointed at new code
# without the reference here changing. Dependabot proposes SHA bumps; review them.
#
# All SHAs below were verified against the GitHub API on 2026-08-25 by resolving the
# tag ref and comparing, rather than trusting a copied value.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. No job here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never abandon a main commit half-verified.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    # The same script text must run on Windows runners as on POSIX ones.
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # A hang guard, not a performance budget. Measured 2026-09-02: Windows runners take 16-17 min
    # (POSIX runners 1-4 min), and each additional full-pipeline test costs Windows ~1.3 min. At 20
    # minutes a single new pipeline-backed test tipped all four Windows jobs into the timeout.
    timeout-minutes: 30
    strategy:
      fail-fast: false # one OS failing must not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # --frozen: fail if uv.lock is stale rather than silently re-resolving.
      #
      # The `office` extra is skipped on 3.14: markitdown -> magika -> onnxruntime
      # publishes no cp314 wheels (only cp311/cp312/cp313/cp313t). The core package and
      # the `notebook` extra are fully 3.14-capable, so 3.14 is still a first-class
      # matrix entry rather than being dropped. Remove this branch once onnxruntime
      # ships cp314 wheels.
      - name: Sync locked environment
        run: |
          set -euo pipefail
          if [ "${{ matrix.python }}" = "3.14" ]; then
            echo "3.14: syncing without the office extra (onnxruntime has no cp314 wheel)"
            uv sync --frozen --extra notebook --dev
          else
            uv sync --frozen --all-extras --dev
          fi

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check src tests tools

      - name: Types
        # Match mypy's grammar and stdlib surface to the interpreter/dependency
        # environment in this matrix job. The project default remains 3.11 so
        # the standalone gate still checks the minimum supported Python version.
        run: uv run mypy --python-version "${{ matrix.python }}" src tests tools

      - name: Tests
        run: uv run pytest -q

      - name: Coverage (one representative matrix job)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv run pytest --cov=agent2learn --cov-branch --cov-report=term-missing

      - name: Build sdist and wheel
        run: uv build

      # Install the built wheel into a throwaway environment with no source tree on
      # sys.path, so a missing packaged module cannot be masked by the working copy.
      - name: Install wheel in a clean environment and smoke test
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/a2l-smoke-${{ matrix.os }}-${{ matrix.python }}"
          uv venv "$SMOKE" --python ${{ matrix.python }}
          WHEEL=$(uv run python -c 'import glob; paths=glob.glob("dist/*.whl"); assert len(paths) == 1, paths; print(paths[0])')
          echo "installing $WHEEL"
          uv pip install --python "$SMOKE" "$WHEEL"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$SMOKE/Scripts"; else BIN="$SMOKE/bin"; fi
          "$BIN/a2l" --version
          "$BIN/a2l" --version | grep -q "agent2learn"

      - name: Installed wheel skill source smoke
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/a2l-smoke-${{ matrix.os }}-${{ matrix.python }}"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$SMOKE/Scripts"; else BIN="$SMOKE/bin"; fi
          "$BIN/python" tools/smoke_installed_skills.py

  installers:
    # Proves the published one-command install path against the candidate wheel, never against
    # PyPI. The local index is configured only in this process, and the installers themselves
    # expose no way to point at an arbitrary package: the version they install is embedded.
    name: installer · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Build the candidate wheel
        run: uv build

      # A flat directory of candidate artifacts is a find-links source, not a simple index, and
      # UV_FIND_LINKS scopes it to this job only. Dependencies still resolve normally; the point
      # is that `agent2learn` itself can only come from the candidate build, because no release
      # of it exists on PyPI. The installers cannot be pointed anywhere by a flag.
      - name: Stage the candidate build as an isolated local source
        run: |
          set -euo pipefail
          INDEX="$RUNNER_TEMP/a2l-candidate"
          mkdir -p "$INDEX/simple/agent2learn"
          cp dist/*.whl dist/*.tar.gz "$INDEX/"
          A2L_CANDIDATE_INDEX="$INDEX" python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["A2L_CANDIDATE_INDEX"])
          distributions = sorted(
              path for path in root.iterdir() if path.suffix == ".whl" or path.name.endswith(".tar.gz")
          )
          if not distributions:
              raise SystemExit("candidate build contains no distribution")
          links = [
              f'<a href="../../{path.name}#sha256={hashlib.sha256(path.read_bytes()).hexdigest()}">'
              f"{path.name}</a>"
              for path in distributions
          ]
          (root / "simple" / "agent2learn" / "index.html").write_text(
              "\n".join(links) + "\n", encoding="utf-8", newline="\n"
          )
          PY
          # A first-priority local PEP 503 index makes the candidate's hash-bearing link the only
          # possible source for agent2learn, even after this version is published on PyPI.
          echo "UV_INDEX=$INDEX/simple" >> "$GITHUB_ENV"
          echo "UV_DEFAULT_INDEX=https://pypi.org/simple" >> "$GITHUB_ENV"
          echo "UV_INDEX_STRATEGY=first-index" >> "$GITHUB_ENV"
          # Keep the flat source as defence in depth for uv versions that inspect find-links too.
          echo "UV_FIND_LINKS=$INDEX" >> "$GITHUB_ENV"

      - name: Non-interactive install.sh keeps its hands off onboarding
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          output="$(bash install.sh 2>&1 | tee /dev/stderr)"
          grep -Fq "run in a terminal: a2l init" <<< "$output"
          grep -Fq "verified: " <<< "$output"
          grep -Fq "$(uv run python -c 'import agent2learn; print(agent2learn.__version__)')" \
            <<< "$output"

      - name: Non-interactive install.ps1 keeps its hands off onboarding
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = (& ./install.ps1 | Out-String)
          Write-Output $output
          if ($output -notmatch 'run in a terminal: a2l init') { throw "missing handoff" }
          if ($output -notmatch 'verified: ') { throw "missing verification" }

      - name: The installers stay pinned and offer no package override
        run: uv run pytest tests/test_installers.py -q

  dependencies:
    # The lock is the authority for release artifacts. This job exists to detect stale
    # bounds: it resolves WITHOUT the lock, so a dependency that has moved past our
    # declared ceiling, or a newly disclosed vulnerability, fails here rather than
    # silently persisting in a pinned environment.
    name: dependency audit · SBOM · notices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      # The dependency probes below intentionally rewrite uv.lock while resolving outside the
      # lock. Preserve the committed artifact so all release-facing checks return to the exact
      # dependency set whose versions are recorded in THIRD_PARTY_NOTICES.md.
      - name: Preserve committed lock
        run: cp uv.lock "$RUNNER_TEMP/a2l-committed-uv.lock"

      # The golden vault pins byte-for-byte output at the LOCKED dependency set. This job
      # deliberately re-resolves outside the committed lock, and the manifest records a tool_version
      # for every converter, so a different nbformat or markitdown legitimately produces
      # different bytes. Asserting parity across library versions would be a category
      # error, so only that one comparison is deselected — the rest of the golden suite
      # (within-run determinism, adversarial coverage, LF endings, no backslash in links)
      # is version-independent and still runs here.
      - name: Resolve newest allowed versions (no lock)
        run: uv sync --upgrade --all-extras --dev

      - name: Tests against newest allowed versions
        run: >-
          uv run pytest -q
          --deselect tests/test_golden_vault.py::test_vault_is_byte_identical_across_platforms

      - name: Resolve lowest allowed versions (no lock)
        run: uv sync --upgrade --resolution lowest-direct --all-extras --dev

      - name: Tests against lowest allowed versions
        run: >-
          uv run pytest -q
          --deselect tests/test_golden_vault.py::test_vault_is_byte_identical_across_platforms

      - name: Audit for known vulnerabilities
        run: |
          cp "$RUNNER_TEMP/a2l-committed-uv.lock" uv.lock
          uv sync --frozen --all-extras --dev
          uv run pip-audit --progress-spinner off

      - name: Generate CycloneDX SBOM
        run: uv run cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Third-party notices are current
        run: |
          set -euo pipefail
          uv run python tools/check_notices.py

      - name: Live skills.sh schema validation
        run: |
          set -euo pipefail
          uv sync --frozen --all-extras --dev
          A2L_SCHEMA_FILE="$RUNNER_TEMP/skills.sh.schema.json"
          curl -fsSL https://skills.sh/schemas/skills.sh.schema.json -o "$A2L_SCHEMA_FILE"
          npx --yes ajv-cli validate --spec=draft2020 --strict=false -s "$A2L_SCHEMA_FILE" -d skills.sh.json

      - name: Skills registry compatibility smoke
        run: |
          set -euo pipefail
          uv sync --frozen --all-extras --dev
          uv run python tools/check_skills_registry.py --network
          A2L_NPX_CACHE="$RUNNER_TEMP/a2l-npm-cache"
          mkdir -p "$A2L_NPX_CACHE"
          npm_config_cache="$A2L_NPX_CACHE" npx --yes skills add "$GITHUB_WORKSPACE" --list | tee "$RUNNER_TEMP/a2l-local-skills.txt"
          for slug in a2l-setup a2l-sync a2l-study a2l-coursework; do
            grep -F -- "$slug" "$RUNNER_TEMP/a2l-local-skills.txt"
          done
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            npm_config_cache="$A2L_NPX_CACHE" npx --yes skills add ManagementMO/agent2learn --list | tee "$RUNNER_TEMP/a2l-remote-skills.txt"
            for slug in a2l-setup a2l-sync a2l-study a2l-coursework; do
              grep -F -- "$slug" "$RUNNER_TEMP/a2l-remote-skills.txt"
            done
          else
            echo "Skipping public ManagementMO/agent2learn npx smoke on pull_request because GitHub main may not contain this checkout yet."
          fi

  secret-scan:
    # Least privilege: no PR comments and no artifact upload, so a detected secret is
    # never copied into a second surface where it would need redacting again.
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, required by the explicit scan below
          persist-credentials: false

      # The action scans the pushed commit range, which is the right incremental
      # behaviour for PRs but is NOT full history: the first run reported "1 commits
      # scanned". A secret committed earlier and later removed would never be seen.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      # Full reachable history, as the plan requires. --redact so a finding is reported
      # without echoing the secret into a public log. Cheap now; revisit if it slows.
      - name: Scan full reachable history
        env:
          GITLEAKS_VERSION: 8.30.1 # matches the version selected for the pinned action
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks --version
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
